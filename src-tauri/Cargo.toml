[package]
name = "rsmd"
version = "0.1.0"
edition = "2024"

[lib]
name = "rsmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = "0.39"
notify = "8"
notify-debouncer-full = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSResponder", "NSWindow", "NSView", "NSControl", "NSButton"] }
dispatch2 = "0.3"

[dev-dependencies]
tempfile = "3"
